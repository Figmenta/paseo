npmRebuild: false
appId: it.figmenta.orchestra
productName: Orchestra
executableName: Orchestra
protocols:
  - name: Orchestra agent link
    schemes:
      - paseo
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
  # Figmenta fork: the figmenta-sessions plugin ships inside the app and is seeded into
  # ~/.paseo/config.json at boot. The source lives in the monorepo (packages/desktop/
  # figmenta-plugin) so the build never reaches outside the checkout. The daemon esbuilds
  # the plugin from this directory and externalizes only react/react-native/@getpaseo/plugin,
  # so `zod` — its one bundled runtime dependency — must be resolvable from here.
  - from: figmenta-plugin
    to: plugins/figmenta-sessions
    filter:
      - "!node_modules"
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
  - from: ../../node_modules/zod
    to: plugins/figmenta-sessions/node_modules/zod
# Figmenta fork: Orchestra is distributed by hand, not through a GitHub release feed.
# The in-app update commands are no-ops (daemon-manager.ts) to match.
publish: null
mac:
  artifactName: "Orchestra-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  # Figmenta fork: internal distribution, no Developer ID signing or notarization.
  hardenedRuntime: false
  notarize: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: assets/icon.png
      to: icon.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Orchestra-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Figmenta"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/paseo CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "Orchestra-${arch}.${ext}"
win:
  artifactName: "Orchestra-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
