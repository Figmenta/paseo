# Figmenta fork: Orchestra Desktop installers are no longer built in this repository.
#
# From Orchestra Desktop 1.1.0 the app ships the private figmenta-sessions plugin, whose source
# never enters this public repository nor an artifact of its workflows (docs/FIGMENTA.md,
# "Plugin injection"). A build here would have no plugin, so these tags fail at once with a
# pointer instead of burning a runner on an installer the build guard would refuse anyway:
#   - Windows: .github/workflows/desktop-windows.yml in the private repository
#     Figmenta/paseo-orchestra-plugin, tag `desktop-win-v<app version>`.
#   - macOS: the signed release on the Mac with the Developer ID identity, after the plugin
#     sync (packages/desktop/scripts/figmenta-release-mac.sh).
name: Figmenta desktop installers (moved)

on:
  push:
    tags:
      - "figmenta-win-*"
      - "figmenta-mac-*"

permissions: {}

jobs:
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point at the private build
        run: |
          echo "::error::Orchestra Desktop is not built from this public repository any more (the plugin is private). Windows: tag desktop-win-v<version> in Figmenta/paseo-orchestra-plugin (.github/workflows/desktop-windows.yml). macOS: figmenta-plugin-sync.sh, then packages/desktop/scripts/figmenta-release-mac.sh on the signing Mac. See docs/FIGMENTA.md, \"Plugin injection\"."
          exit 1
