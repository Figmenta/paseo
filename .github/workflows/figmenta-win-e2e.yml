# Figmenta fork: end-to-end test of Orchestra Desktop's mandatory updater on a real
# Windows machine, one-click installer. A: the PUBLISHED assisted 1.0.1 updates to this
# commit (NEW, one-click): same folder, one Uninstall entry, relaunch within 60 s.
# B (main acceptance): NEW updates to NEXT (same code, version bump): same checks.
# Nothing is published, no secret is used. Trigger: tag `figmenta-e2e-win-*` (not
# `figmenta-win-*`, which also starts the installer workflow).
name: Figmenta Windows updater e2e

on:
  push:
    tags:
      - "figmenta-e2e-win-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Work directories
        shell: bash
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP")
          echo "E2E_WORK=$temp/orchestra-e2e" >> "$GITHUB_ENV"
          echo "E2E_OUT=$temp/orchestra-e2e-out" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Download the published assisted installer and check it against the published feed
        shell: bash
        env:
          PUBLISHED_URL: https://downloads.figmenta.site/orchestra-desktop/updates/1.0.1/Orchestra-Setup-1.0.1-x64.exe
          FEED: https://downloads.figmenta.site/orchestra-desktop/updates/latest.yml
        run: |
          set -euo pipefail
          mkdir -p "$E2E_WORK/feed-a" "$E2E_WORK/feed-b" "$E2E_OUT"
          curl -fsSL "$FEED" -o "$E2E_OUT/published-latest.yml"
          cat "$E2E_OUT/published-latest.yml"
          curl -fsSL "$PUBLISHED_URL" -o "$E2E_WORK/installer-published.exe"
          got=$(node -e "const c=require('crypto');console.log(c.createHash('sha512').update(require('fs').readFileSync(process.argv[1])).digest('base64'))" "$E2E_WORK/installer-published.exe")
          echo "downloaded sha512: $got"
          if grep -q "url: 1.0.1/Orchestra-Setup-1.0.1-x64.exe" "$E2E_OUT/published-latest.yml"; then
            grep -q "sha512: $got" "$E2E_OUT/published-latest.yml" || { echo "::error::sha512 of the published 1.0.1 does not match latest.yml"; exit 1; }
            echo "sha512 matches the published latest.yml"
          else
            echo "::warning::latest.yml no longer lists 1.0.1: sha512 not verifiable against it"
          fi
          echo "E2E_PUBLISHED=1.0.1" >> "$GITHUB_ENV"

      - name: Build this commit (one-click, NEW) and the same code bumped (NEXT)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          new=$(node -p "require('./packages/desktop/package.json').version")
          next=$(node -p "const [a,b,c]=process.argv[1].split('.').map(Number);[a,b,c+1].join('.')" "$new")
          echo "E2E_NEW=$new" >> "$GITHUB_ENV"
          echo "E2E_NEXT=$next" >> "$GITHUB_ENV"
          npm run build:desktop -- --publish never --win nsis --x64
          cp "packages/desktop/release/Orchestra-Setup-$new-x64.exe" "$E2E_WORK/installer-new.exe"
          cp packages/desktop/release/latest.yml "packages/desktop/release/Orchestra-Setup-$new-x64.exe" "packages/desktop/release/Orchestra-Setup-$new-x64.exe.blockmap" "$E2E_WORK/feed-a/"
          cp "$E2E_WORK/feed-a/latest.yml" "$E2E_OUT/feed-a-$new-latest.yml"
          node -e "const f='packages/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$next"
          (cd packages/desktop && npm run build:main && npx electron-builder --config electron-builder.yml --publish never --win nsis --x64)
          cp packages/desktop/release/latest.yml "packages/desktop/release/Orchestra-Setup-$next-x64.exe" "packages/desktop/release/Orchestra-Setup-$next-x64.exe.blockmap" "$E2E_WORK/feed-b/"
          cp "$E2E_WORK/feed-b/latest.yml" "$E2E_OUT/feed-b-$next-latest.yml"

      - name: Run the updater e2e (A migration, B steady state)
        run: node .github/figmenta-win-e2e/e2e.mjs

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-windows-updater-e2e
          path: ${{ env.E2E_OUT }}
          if-no-files-found: warn
          retention-days: 14
