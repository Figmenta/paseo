# Figmenta fork: end-to-end test of Orchestra Desktop's mandatory updater on a real
# Windows machine. Builds this commit as released (X) and the same code bumped to X+1,
# installs X, announces X+1 on a loopback feed and drives the installed app through CDP:
# overlay, "Installa e riavvia", silent install, and Orchestra's own relaunch on X+1
# within 60 s; plus a negative case (feed announcing 0.9.0 = no overlay).
# Nothing is published, no secret is used. Trigger: tag `figmenta-e2e-win-*` (not
# `figmenta-win-*`, which also starts the installer workflow).
name: Figmenta Windows updater e2e

on:
  push:
    tags:
      - "figmenta-e2e-win-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater-e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Work directories
        shell: bash
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP")
          echo "E2E_WORK=$temp/orchestra-e2e" >> "$GITHUB_ENV"
          echo "E2E_OUT=$temp/orchestra-e2e-out" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build the version under test (this commit) and a newer one to announce
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          mkdir -p "$E2E_WORK/feed-new" "$E2E_WORK/feed-old" "$E2E_OUT"
          from=$(node -p "require('./packages/desktop/package.json').version")
          to=$(node -p "const [a,b,c]=process.argv[1].split('.').map(Number);[a,b,c+1].join('.')" "$from")
          echo "E2E_FROM=$from" >> "$GITHUB_ENV"
          echo "E2E_TO=$to" >> "$GITHUB_ENV"
          # 1. the version that updates itself: this commit, as released
          npm run build:desktop -- --publish never --win nsis --x64
          cp "packages/desktop/release/Orchestra-Setup-$from-x64.exe" "$E2E_WORK/installer.exe"
          cp packages/desktop/release/latest.yml "$E2E_OUT/installed-$from-latest.yml"
          # 2. the version it updates to: same code, version bump only (packaging only)
          node -e "const f='packages/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$to"
          (cd packages/desktop && npm run build:main && npx electron-builder --config electron-builder.yml --publish never --win nsis --x64)
          cp packages/desktop/release/latest.yml "packages/desktop/release/Orchestra-Setup-$to-x64.exe" "packages/desktop/release/Orchestra-Setup-$to-x64.exe.blockmap" "$E2E_WORK/feed-new/"
          cat "$E2E_WORK/feed-new/latest.yml"
          cp "$E2E_WORK/feed-new/latest.yml" "$E2E_OUT/announced-$to-latest.yml"
          cat > "$E2E_WORK/feed-old/latest.yml" <<'EOF'
          version: 0.9.0
          files:
            - url: Orchestra-Setup-0.9.0-x64.exe
              sha512: AAAA
              size: 1
          path: Orchestra-Setup-0.9.0-x64.exe
          sha512: AAAA
          releaseDate: '2026-01-01T00:00:00.000Z'
          EOF

      - name: Run the updater e2e (installed version -> announced version)
        run: node .github/figmenta-win-e2e/e2e.mjs

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-windows-updater-e2e
          path: ${{ env.E2E_OUT }}
          if-no-files-found: warn
          retention-days: 14
